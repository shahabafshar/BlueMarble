        // ------------------------------------------------------------
        // GENERIC GLB UTILITIES — used by both player and NPCs
        // ------------------------------------------------------------
        // Parse a base64-inlined GLB once, cache the result. Callback-based
        // because GLTFLoader.parse is internally Promise-driven (so its
        // onLoad fires asynchronously even for inline binary data). Once
        // cached, subsequent calls fire the callback synchronously.
        const _parsedGLBCache = {};
        function parseGLBOnce(urlOrId, callback) {
            // v2: fetches from a URL (CDN or relative path).
            // Falls back to reading an inlined <script> block if the
            // argument looks like a DOM id (for v1 compat / file://).
            if (_parsedGLBCache[urlOrId]) { callback(_parsedGLBCache[urlOrId]); return; }

            // If it looks like a URL, fetch it
            if (urlOrId.startsWith('http') || urlOrId.startsWith('/') || urlOrId.startsWith('.')) {
                fetch(urlOrId)
                    .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })
                    .then(buf => {
                        const loader = new THREE.GLTFLoader();
                        if (typeof THREE.DRACOLoader === 'function') {
                            const draco = new THREE.DRACOLoader();
                            draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                            loader.setDRACOLoader(draco);
                        }
                        loader.parse(buf, '', (gltf) => {
                            const result = { scene: gltf.scene, animations: gltf.animations };
                            _parsedGLBCache[urlOrId] = result;
                            callback(result);
                        }, (err) => {
                            console.warn('[glb] parse error for ' + urlOrId + ':', err);
                            callback(null);
                        });
                    })
                    .catch(err => {
                        console.warn('[glb] fetch failed for ' + urlOrId + ':', err.message);
                        callback(null);
                    });
                return;
            }

            // Legacy: try reading from an inlined <script> block (v1 compat / file://)
            const dataNode = document.getElementById(urlOrId);
            if (!dataNode || !THREE.GLTFLoader) { callback(null); return; }
            try {
                const b64 = dataNode.textContent.replace(/\s/g, '');
                const binStr = atob(b64);
                const bytes = new Uint8Array(binStr.length);
                for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);
                const loader = new THREE.GLTFLoader();
                if (typeof THREE.DRACOLoader === 'function') {
                    const draco = new THREE.DRACOLoader();
                    draco.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
                    loader.setDRACOLoader(draco);
                }
                loader.parse(bytes.buffer, '', (gltf) => {
                    const result = { scene: gltf.scene, animations: gltf.animations };
                    _parsedGLBCache[urlOrId] = result;
                    callback(result);
                }, (err) => {
                    console.error('[glb] parse error for ' + urlOrId + ':', err);
                    callback(null);
                });
            } catch (e) {
                console.error('[glb] error for ' + urlOrId + ':', e);
                callback(null);
            }
        }

        // Build a character "instance" from a parsed GLB. Clones the scene
        // (with skeleton intact via SkeletonUtils), clones materials so the
        // instance can be tinted independently, scales to a target height,
        // wraps in a pivot, and creates a per-instance AnimationMixer.
        // Returns { group, model, mixer, actions, pivot } or null on failure.
        //
        // opts:
        //   targetHeight   — target visible height; auto-scaled (default CH)
        //   manualScale    — if set, skip bbox auto-scale and use this exact
        //                    scale (used for SkinnedMesh models whose rest-
        //                    pose bbox is unreliable, e.g. HVGirl)
        //   manualRotX     — extra X rotation in radians applied to the
        //                    pivot (used when a model is authored Z-up)
        function buildGLBInstance(parsed, opts) {
            if (!parsed || !THREE.SkeletonUtils) return null;
            opts = opts || {};
            const targetHeight = opts.targetHeight || CH;

            const model = THREE.SkeletonUtils.clone(parsed.scene);

            // Clone materials so per-instance tints don't bleed into siblings
            model.traverse((node) => {
                if (node.isMesh) {
                    node.castShadow = true;
                    if (node.material) {
                        // Convert PBR (StandardMaterial) → Lambert (matte)
                        // so imported characters match the world's flat look.
                        const toLambert = (m) => {
                            let c;
                            if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
                                c = new THREE.MeshLambertMaterial({
                                    color: m.color ? m.color.clone() : new THREE.Color(0xffffff),
                                    map: null,  // v2: strip textures for flat look
                                    transparent: m.transparent,
                                    opacity: m.opacity,
                                    side: m.side,
                                    skinning: true,
                                });
                            } else {
                                c = m.clone();
                            }
                            c.flatShading = true;
                            c.needsUpdate = true;
                            return c;
                        };
                        if (Array.isArray(node.material)) {
                            node.material = node.material.map(toLambert);
                        } else {
                            node.material = toLambert(node.material);
                        }
                    }
                }
            });

            // Scale: use explicit manualScale if provided, otherwise auto-fit
            // by Y dimension of the rest-pose bounding box.
            if (opts.manualScale !== undefined) {
                model.scale.setScalar(opts.manualScale);
            } else {
                let box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);
                const scale = targetHeight / size.y;
                model.scale.setScalar(scale);
            }

            // Lift so feet sit at y = 0 (after scaling)
            const box2 = new THREE.Box3().setFromObject(model);
            model.position.y = -box2.min.y;

            const pivot = new THREE.Group();
            if (opts.manualRotX) pivot.rotation.x = opts.manualRotX;
            pivot.add(model);

            const group = new THREE.Group();
            group.add(pivot);

            // Mixer + actions for this instance
            const mixer = new THREE.AnimationMixer(model);
            const actions = {};
            for (const clip of parsed.animations) {
                // Strip common prefixes: Rig|, CharacterArmature|, Armature|
                // so Rig|Walk becomes Walk, Rig|Idle becomes Idle, etc.
                // The state machine and taunt system use unprefixed names.
                const cleanName = clip.name.replace(/^(Rig|CharacterArmature|Armature)\|/, '');
                actions[cleanName] = mixer.clipAction(clip);
            }

            return { group, model, mixer, actions, pivot };
        }

        // Walk a procedural mesh and pick the most representative material
        // color. For 'tree' we look for the most leaf-like (green-dominant)
        // material so the GLB tree gets tinted with foliage color, not bark.
        // For everything else we just take the first color we find.
        function _extractDominantColor(mesh, type) {
            const colors = [];
            mesh.traverse(n => {
                if (!n.isMesh || !n.material) return;
                const mats = Array.isArray(n.material) ? n.material : [n.material];
                for (const m of mats) if (m.color) colors.push(m.color);
            });
            if (colors.length === 0) return null;
            if (type === 'tree') {
                let best = colors[0], bestScore = -Infinity;
                for (const c of colors) {
                    const score = c.g - (c.r + c.b) / 2;
                    if (score > bestScore) { bestScore = score; best = c; }
                }
                return best.clone();
            }
            return colors[0].clone();
        }

        // Tint a model in-place. Caches each material's original color the
        // first time it's called so subsequent calls re-apply on top of the
        // ORIGINAL (not the previous tint), so cycling through tints works.
        // `tint` is a THREE.Color (or any { r, g, b }) used as a multiplier.
        function tintGLBModel(rootGroup, tint) {
            rootGroup.traverse((node) => {
                if (!node.isMesh || !node.material) return;
                const apply = (mat) => {
                    if (!mat.color) return;
                    if (!mat.userData._origColor) {
                        mat.userData._origColor = mat.color.clone();
                    }
                    mat.color.copy(mat.userData._origColor).multiply(tint);
                };
                if (Array.isArray(node.material)) node.material.forEach(apply);
                else apply(node.material);
            });
        }

        // ------------------------------------------------------------
        // NPC GLB UPGRADE
        // ------------------------------------------------------------
        // After the player's GLB has been parsed (so the cache is warm),
        // walk through every NPC in the world, build a fresh GLB instance
        // for each, tint it with a deterministic color derived from the
        // NPC's existing shirtColor, vary the scale a little for height
        // diversity, and swap it in for the procedural mesh. The NPC class
        // detects userData.glb and switches its update path automatically.
        // ------------------------------------------------------------
        // Palette of NPC tints. Picked from a wider range than the player's
        // 6 schemes so the world feels populated by distinct individuals.
        const NPC_TINTS = [
            new THREE.Color(1.00, 1.00, 1.00),
            new THREE.Color(1.00, 0.65, 0.55),
            new THREE.Color(0.55, 0.80, 1.00),
            new THREE.Color(0.65, 1.00, 0.65),
            new THREE.Color(0.80, 0.60, 1.00),
            new THREE.Color(1.00, 0.90, 0.45),
            new THREE.Color(0.55, 1.00, 0.90),
            new THREE.Color(1.00, 0.55, 0.85),
            new THREE.Color(0.70, 0.70, 0.70),
        ];
        function _npcTintFor(shirtColor) {
            // Stable mapping from existing shirtColor to a tint index
            const idx = (shirtColor || 0) % NPC_TINTS.length;
            return NPC_TINTS[idx];
        }

        // Mirror of upgradeNPCsToGLB but for Animal instances of a given
        // type (e.g. 'fox'). Builds a GLB instance, applies optional tint,
        // and slots it into the animal's existing mesh group. The Animal
        // class detects userData.glb and switches its update path.
        function upgradeAnimalsToGLB(parsed, opts) {
            if (!parsed || !THREE.SkeletonUtils) return 0;
            opts = opts || {};
            const matchType = opts.type;
            const targetHeight = opts.targetHeight || 0.6;
            let upgraded = 0;
            for (const obj of world.all) {
                if (obj.constructor.name !== 'Animal') continue;
                if (matchType && obj.type !== matchType) continue;
                if (obj.mesh.userData.glb) continue;

                const inst = buildGLBInstance(parsed, { targetHeight });
                if (!inst) continue;
                if (opts.tint) tintGLBModel(inst.model, opts.tint);

                while (obj.mesh.children.length > 0) obj.mesh.remove(obj.mesh.children[0]);
                obj.mesh.add(inst.pivot);

                obj.mesh.userData.glb = {
                    mixer: inst.mixer,
                    actions: inst.actions,
                    model: inst.model,
                    pivot: inst.pivot,
                    currentAction: null,
                };

                // Start with the "idle" clip for this archetype
                const idleName = inst.actions['Survey'] || inst.actions['Idle']
                    ? (inst.actions['Survey'] ? 'Survey' : 'Idle')
                    : Object.keys(inst.actions)[0];
                if (idleName && inst.actions[idleName]) {
                    inst.actions[idleName].play();
                    obj.mesh.userData.glb.currentAction = idleName;
                }
                upgraded++;
            }
            return upgraded;
        }

        // Tiny placeholder for a fox — an empty group with a small bbox so
        // collision/spatial systems work. Replaced by a real GLB clone after
        // the fox model parses asynchronously.
        // Generic invisible placeholder for CDN-only objects
        // (barrel, haybale, canoe, flag, flowerpot). Replaced at runtime
        // by the CDN model; exists only so place() has a mesh to position.
        function mkCDNPlaceholder() {
            const g = new THREE.Group();
            g.add(new THREE.Mesh(
                new THREE.BoxGeometry(0.3, 0.3, 0.3),
                new THREE.MeshBasicMaterial({ visible: false })
            ));
            return g;
        }

        function mkFoxPlaceholder() {
            const g = new THREE.Group();
            // Invisible cube just to give the group SOME bounds during the
            // brief window before the GLB upgrade fires
            const placeholder = new THREE.Mesh(
                new THREE.BoxGeometry(0.4, 0.4, 0.6),
                new THREE.MeshBasicMaterial({ visible: false })
            );
            g.add(placeholder);
            return g;
        }

        // ------------------------------------------------------------
        // NATURE PROPS — replaces procedural rocks/trees/bushes with
        // low-poly GLB meshes converted from a Quaternius-style FBX kit.
        // Procedural factories still build the original meshes; after the
        // GLBs parse, upgradeNatureToGLB() walks world.all and swaps each
        // visible mesh group with a randomly-picked GLB clone, scaled to
        // match the original procedural mesh's bounding box.
        // ------------------------------------------------------------
        const NATURE_IDS = {
            // v4: Only rocks use CDN replacements. Trees, bushes, flowers
            // stay procedural because each zone needs the RIGHT species
            // (palms for tropics, pines for snow, birch for forest, etc.)
            // CDN tree/bush models are grouped scenes, not individual plants.
            rock:  [
                'https://static.poly.pizza/802d6e7e-73a5-4a54-8848-54ae9350077c.glb',
                'https://static.poly.pizza/de15e8eb-53a1-4e7e-a4c5-fc2299f57158.glb',
            ],
            tree:  [],   // procedural — zone-specific species
            bush:  [],   // procedural — zone-specific
            grass: [],
        }
        const _natureParsed = {};

        // Color palette to remap GLB tree/bush leaf colors. The Quaternius
        // FBX kit uses a single yellow-olive (#84a32e) for all foliage; we
        // remap it onto the richer green family the procedural lpTree used,
        // chosen randomly per instance for variety. Trunk material stays
        // unchanged. For rocks we still use obj._dominantColor (the procedural
        // zone color) since rocks don't have a separate trunk material.
        const NATURE_PALETTE = {
            // Source color the GLB uses for "leaves"
            sourceLeaf: new THREE.Color(0x84a32e),
            // Source color the GLB uses for "trunk/stem"
            sourceTrunk: new THREE.Color(0x321709),
            // Replacement leaf colors — derived from the original procedural
            // tree colors (#5cb85c, #6a9a4a, #2a7a35, #3a8a3a, #4aad5b)
            leafColors: [
                new THREE.Color(0x5cb85c),
                new THREE.Color(0x6a9a4a),
                new THREE.Color(0x2a7a35),
                new THREE.Color(0x3a8a3a),
                new THREE.Color(0x4aad5b),
            ],
        };
        function _isLeafyColor(c) {
            // Detect "leafy" by checking if green dominates the other channels
            return c.g > c.r && c.g > c.b * 1.2;
        }

        // Build a static (non-skinned) clone of a parsed GLB scene at a
        // requested LOCAL height. Returns a Group that can be added as a
        // child of any object's mesh group.
        function _buildNatureClone(parsed, targetHeight, opts) {
            if (!parsed || !parsed.scene) return null;
            opts = opts || {};
            const model = parsed.scene.clone(true);
            const wantsJitter = opts.vertexJitter && opts.vertexJitter > 0;

            // Clone materials so per-instance tints don't bleed. Optionally
            // deep-clone geometries too so per-instance vertex jitter is
            // independent across siblings.
            model.traverse((n) => {
                if (!n.isMesh) return;
                n.castShadow = true;
                if (wantsJitter && n.geometry) {
                    n.geometry = n.geometry.clone();
                }
                if (n.material) {
                    const cloneAndConfig = (m) => {
                        let c;
                        if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
                            c = new THREE.MeshLambertMaterial({
                                color: m.color.clone(),
                                map: opts.keepTextures ? (m.map || null) : null,
                                transparent: m.transparent,
                                opacity: m.opacity,
                                side: m.side,
                            });
                        } else {
                            c = m.clone();
                            if (!opts.keepTextures) c.map = null;
                        }
                        c.flatShading = true;
                        c.vertexColors = false;
                        // Per-material color remap. opts.colorRemap is a
                        // function (origColor, materialIdx) -> THREE.Color
                        // letting callers map specific source colors to a
                        // chosen palette (e.g. yellow leaves -> rich green
                        // while keeping the trunk brown unchanged).
                        if (opts.colorRemap) {
                            const remapped = opts.colorRemap(m.color);
                            if (remapped) c.color = remapped;
                        } else if (opts.tint) {
                            c.color = opts.tint.clone();
                        }
                        c.needsUpdate = true;
                        return c;
                    };
                    if (Array.isArray(n.material)) n.material = n.material.map(cloneAndConfig);
                    else n.material = cloneAndConfig(n.material);
                }
            });

            // Per-instance vertex jitter — irregular silhouettes from a small
            // pool of source shapes. Mirrors what procedural lpRock did.
            if (wantsJitter) {
                const j = opts.vertexJitter;
                model.traverse(n => {
                    if (!n.isMesh || !n.geometry) return;
                    const p = n.geometry.getAttribute('position');
                    if (!p) return;
                    let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
                    for (let i = 0; i < p.count; i++) {
                        const x=p.getX(i), y=p.getY(i), z=p.getZ(i);
                        if (x<minX)minX=x; if (x>maxX)maxX=x;
                        if (y<minY)minY=y; if (y>maxY)maxY=y;
                        if (z<minZ)minZ=z; if (z>maxZ)maxZ=z;
                    }
                    const xAmt = (maxX - minX) * j;
                    const yAmt = (maxY - minY) * j * 0.6;
                    const zAmt = (maxZ - minZ) * j;
                    for (let i = 0; i < p.count; i++) {
                        p.setXYZ(i,
                            p.getX(i) + (Math.random() - 0.5) * xAmt,
                            p.getY(i) + (Math.random() - 0.5) * yAmt,
                            p.getZ(i) + (Math.random() - 0.5) * zAmt
                        );
                    }
                    p.needsUpdate = true;
                    n.geometry.computeVertexNormals();
                });
            }

            // Scale to target height (Y-up).
            const box = new THREE.Box3().setFromObject(model);
            const size = new THREE.Vector3();
            box.getSize(size);
            if (size.y > 0.001 && targetHeight > 0.001) {
                model.scale.setScalar(targetHeight / size.y);
            }
            // Lift so base sits at y=0
            const box2 = new THREE.Box3().setFromObject(model);
            model.position.y = -box2.min.y;

            // Wrap in a Group for per-instance Y rotation + non-uniform scale.
            // This is the cheap "make 3 source meshes look like 30+" trick.
            const g = new THREE.Group();
            if (opts.rotateY !== false) {
                g.rotation.y = Math.random() * Math.PI * 2;
            }
            if (opts.scaleVariance && opts.scaleVariance > 0) {
                const v = opts.scaleVariance;
                g.scale.set(
                    1 + (Math.random() - 0.5) * 2 * v,
                    1 + (Math.random() - 0.5) * 2 * v,
                    1 + (Math.random() - 0.5) * 2 * v
                );
            }
            g.add(model);
            return g;
        }

        // Walk world.all and swap procedural rock/tree/bush meshes with
        // a random GLB clone of the same approximate size. Called after
        // all four nature parses complete.
        function upgradeNatureToGLB() {
            let upgraded = 0;
            // Per-type opts:
            //   tuning        — multiplier on the procedural natural Y
            //   vertexJitter  — per-vertex random offset (rocks only)
            //   scaleVariance — per-instance non-uniform scale variation
            const TYPE_OPTS = {
                // Rocks: GLB native color (#1f1f1f) is too dark; we tint
                // them with the procedural zone color (#a09880 desert,
                // #8a8a98 snowy etc). NO vertex jitter — the GLB rocks
                // have native vertex coords at ~0.01 scale, so jitter
                // mangles the silhouette. Variation comes from 3 source
                // shapes + scale variance + Y rotation.
                rock:  { tuning: 0.55, applyTint: true,  scaleVariance: 0.22 },
                // Trees: keep ALL native materials (leaves AND trunk).
                // Tinting was overwriting the trunk brown with leaf green.
                tree:  { tuning: 1.10, applyTint: false, scaleVariance: 0.15 },
                // Bushes: same — they have leafy + stem materials.
                bush:  { tuning: 0.85, applyTint: false, scaleVariance: 0.18 },
            };
            for (const obj of world.all) {
                if (obj.category !== 'vegetation') continue;
                const ids = NATURE_IDS[obj.type];
                if (!ids) continue;
                const parsedList = ids.map(id => _natureParsed[id]).filter(Boolean);
                if (parsedList.length === 0) continue;
                if (!obj._naturalSize) continue;
                const typeOpts = TYPE_OPTS[obj.type] || { tuning: 1, vertexJitter: 0, scaleVariance: 0 };

                const targetWorldY = obj._naturalSize.y * obj._intendedFinalScale * typeOpts.tuning;
                const parsed = parsedList[Math.floor(Math.random() * parsedList.length)];

                obj.mesh.scale.set(1, 1, 1);
                obj.scale = 1;
                obj.mesh.updateMatrixWorld(true);

                // Pick a leaf color for this instance once (so all leaf
                // materials in the same tree share the same green).
                const instanceLeaf = NATURE_PALETTE.leafColors[
                    Math.floor(Math.random() * NATURE_PALETTE.leafColors.length)
                ];
                const buildOpts = { scaleVariance: typeOpts.scaleVariance };
                if (obj.type === 'rock') {
                    // Rocks: solid tint with the procedural zone color.
                    buildOpts.tint = obj._dominantColor;
                } else if (obj.type === 'tree' || obj.type === 'bush') {
                    buildOpts.keepTextures = true;
                    buildOpts.colorRemap = (origColor) => {
                        if (_isLeafyColor(origColor)) return instanceLeaf.clone();
                        return null;
                    };
                }
                const replacement = _buildNatureClone(parsed, targetWorldY, buildOpts);
                if (!replacement) continue;

                while (obj.mesh.children.length > 0) obj.mesh.remove(obj.mesh.children[0]);
                obj.mesh.add(replacement);
                upgraded++;
            }
            console.log('[nature] upgraded ' + upgraded + ' nature objects (rocks/trees/bushes)');
        }

        // Kick off parses for every nature GLB. Once all are loaded, run
        // the upgrade pass. Each parse is independent — if one fails the
        // others still upgrade their respective types.
        function loadAllNature() {
            const allIds = [];
            for (const ids of Object.values(NATURE_IDS)) for (const id of ids) allIds.push(id);
            let pending = allIds.length;
            for (const id of allIds) {
                parseGLBOnce(id, (parsed) => {
                    if (parsed) _natureParsed[id] = parsed;
                    if (--pending === 0) upgradeNatureToGLB();
                });
            }
        }


        // ============================================================
        // CDN WORLD OBJECTS — replace procedural landmarks with real
        // Quaternius GLBs fetched from Poly Pizza CDN. Each entry maps
        // a world object type+name to a CDN URL. After the GLB loads,
        // the procedural mesh children are replaced with the CDN model,
        // converted to Lambert, textures kept for buildings.
        // ============================================================
        const CDN_WORLD_OBJECTS = {
            // Buildings — replace procedural landmarks
            'castle':     'https://static.poly.pizza/22111935-8912-4e80-836d-9b105da164f5.glb',  // single-piece castle
            'temple':     'https://static.poly.pizza/ab9c5809-9dd3-431a-ad3d-313f18288312.glb',
            'lighthouse': 'https://static.poly.pizza/d20bd92c-e18d-4d3d-83bd-2bb2c1a77cf5.glb',
            'windmill':   'https://static.poly.pizza/1b81d893-ed98-4c0e-9f68-2f3d125a4e43.glb',
            'pyramid':    'https://static.poly.pizza/e388ae1f-f495-4904-8e76-278a608fac58.glb',
            // house: kept procedural (zone-themed colors differ)
            'well':       'https://static.poly.pizza/0e044203-f62e-4dad-ad3e-c3cb6cb393ac.glb',
            'dock':       'https://static.poly.pizza/a34d55ba-16d6-4951-9126-8c15315cb6e4.glb',
            'bench':      'https://static.poly.pizza/623120d8-bebf-4bd9-bb09-3162c06c9741.glb',
            // market: kept procedural (zone-themed)
            'shipwreck':  'https://static.poly.pizza/941391c3-04a0-43fe-9f7a-c8e7d3b3a77d.glb',
            'statue':     'https://static.poly.pizza/55b0aa03-543c-439d-a7d7-f0ac4c23578f.glb',
            'tower':      'https://static.poly.pizza/749bb696-9058-4290-a5d6-92fb97a9a641.glb',
            // Nature — replace procedural factories
            'palm':       'https://static.poly.pizza/4c17decd-3087-4afe-9611-cfd92cca47cd.glb',
            'cactus':     'https://static.poly.pizza/e130904b-00de-4f96-b462-5244689aa8d8.glb',
            // v4: new replacements
            'bridge':     'https://static.poly.pizza/e36966b4-e13e-46e8-aa2c-f9b643536d46.glb',
            'mushroom':   'https://static.poly.pizza/7298b2d4-1848-4ed4-8922-eb3b42cf1625.glb',
            'lamppost':   'https://static.poly.pizza/1a94c508-7715-4b69-ba7e-c095f250b7d1.glb',
            'icespike':   'https://static.poly.pizza/5d75f150-80ee-4345-b823-7d566742501c.glb',
            'fence':      'https://static.poly.pizza/ee42b0f4-fbcd-425f-804e-02d791bc35f6.glb',
            'driftwood':  'https://static.poly.pizza/89d5c7b9-0735-4640-913d-87261dfecd32.glb',
            // v4: new decoration types (no procedural counterpart)
            'barrel':     'https://static.poly.pizza/6d3e8847-bda4-4d6c-8004-7b03cf848b13.glb',
            'haybale':    'https://static.poly.pizza/8ab0043c-9a54-47b1-9b46-31b98d2f6ed8.glb',
            'canoe':      'https://static.poly.pizza/f4658b1b-54f0-488c-8baf-93dc358a53fa.glb',
            'flag':       'https://static.poly.pizza/4cd7e950-9c30-4005-8a7d-81b4d555715e.glb',
            'flowerpot':  'https://static.poly.pizza/a4099037-d834-455a-b706-d7878b039ceb.glb',
            // v4 phase 2: Fantasy RTS + additional items
            'marktstall':  'https://static.poly.pizza/e5bf8ed1-969f-424b-924a-a7aea1d92d9a.glb',
            'hut':         'https://static.poly.pizza/36d65045-d2ff-4689-a34d-a4acbe1873cb.glb',
            'port':        'https://static.poly.pizza/27270a0e-cb71-40f7-91b1-1421ab9b17b9.glb',
            'villagemkt':  'https://static.poly.pizza/d99b4be3-5157-4dda-b308-ad77acbe8801.glb',
        };

        function upgradeWorldObjectsFromCDN() {
            const typesToUpgrade = Object.keys(CDN_WORLD_OBJECTS);
            let upgraded = 0, pending = 0;

            for (const obj of world.all) {
                // Match by type (e.g. 'castle', 'temple', 'house', 'palm')
                const url = CDN_WORLD_OBJECTS[obj.type];
                if (!url) continue;
                // Skip campfires and other special types
                if (obj.type === 'campfire') continue;

                pending++;
                parseGLBOnce(url, (parsed) => {
                    if (!parsed) { pending--; return; }

                    // Use stashed _naturalSize (pre-scale bbox from place())
                    // to compute the correct target height. Same approach
                    // that fixed the nature rock sizing.
                    const natY = obj._naturalSize ? obj._naturalSize.y : 1;
                    const fScale = obj._intendedFinalScale || 1;
                    // Per-type size tuning — CDN models have different natural
                    // proportions from the procedural ones. These multipliers
                    // were tuned visually on the PR=200 planet.
                    // Absolute target heights in world units.
                    // Character = 1.8m. Sized so MC can walk through doors,
                    // stand next to furniture, look up at towers.
                    const ABS_HEIGHT = {
                        castle: 18,       // impressive but not giant
                        temple: 10,        // can walk between columns
                        lighthouse: 18,
                        windmill: 14,
                        pyramid: 10,
                        house: 8,         // door height ~2.2m, roof ~5m
                        well: 1.6,        // waist-high
                        dock: 5,           // wide dock platform        // platform at knee/foot level
                        bench: 0.9,       // sit height
                        market: 4,      // stall with awning
                        shipwreck: 20,     // tall-mast sailing ship     // beached ship, taller than MC
                        statue: 5,        // heroic but not colossal
                        tower: 16,
                        palm: 7,          // taller than a house
                        cactus: 2.5,
                        // v4 additions
                        bridge: 3,         // walkable bridge, arch over water
                        mushroom: 0.4,     // small ground scatter
                        lamppost: 3.5,     // street light, above head height
                        icespike: 3,       // dramatic ice formation
                        fence: 1.2,        // waist-high fence
                        driftwood: 1.5,
                        barrel: 1.0,
                        haybale: 1.0,
                        canoe: 1.0,
                        flag: 4,
                        flowerpot: 0.7,
                        marktstall: 3.5,
                        hut: 5,
                        fortress: 10,
                        port: 4,
                        villagemkt: 4,    // beached log      // chest to head height
                    };
                    const targetHeight = ABS_HEIGHT[obj.type] || (natY * fScale);

                    // Clear parent scale — bake everything into the clone
                    obj.mesh.scale.set(1, 1, 1);
                    obj.scale = 1;
                    obj.mesh.updateMatrixWorld(true);

                    // Clone + convert materials to Lambert (matte)
                    const model = parsed.scene.clone(true);
                    model.traverse(n => {
                        if (!n.isMesh) return;
                        n.castShadow = true;
                        n.receiveShadow = true;
                        if (n.material) {
                            const convert = (m) => {
                                if (m.isMeshStandardMaterial || m.isMeshPhysicalMaterial) {
                                    return new THREE.MeshLambertMaterial({
                                        color: m.color ? m.color.clone() : new THREE.Color(0xffffff),
                                        map: m.map || null,
                                        transparent: m.transparent,
                                        opacity: m.opacity,
                                        side: m.side,
                                    });
                                }
                                return m.clone();
                            };
                            if (Array.isArray(n.material)) n.material = n.material.map(convert);
                            else n.material = convert(n.material);
                        }
                    });

                    // Scale the CDN model so its height matches the target
                    const newBox = new THREE.Box3().setFromObject(model);
                    const newSize = new THREE.Vector3();
                    newBox.getSize(newSize);
                    if (newSize.y > 0.001 && targetHeight > 0.001) {
                        model.scale.setScalar(targetHeight / newSize.y);
                    }
                    // Lift base to local y=0
                    const finalBox = new THREE.Box3().setFromObject(model);
                    model.position.y = -finalBox.min.y;

                    const wrapper = new THREE.Group();
                    wrapper.add(model);

                    while (obj.mesh.children.length > 0) obj.mesh.remove(obj.mesh.children[0]);
                    obj.mesh.add(wrapper);

                    // Raycast-snap: ensure the object sits on the actual
                    // mesh surface, not the analytical approximation.
                    var snapDir = obj.mesh.position.clone().normalize();
                    var snapRay = new THREE.Raycaster(
                        snapDir.clone().multiplyScalar(PR + 25),
                        snapDir.clone().negate(), 0, 50
                    );
                    var snapHits = snapRay.intersectObject(planet);
                    if (snapHits.length > 0) {
                        obj.mesh.position.copy(snapHits[0].point);
                    }

                    upgraded++;
                    pending--;

                    if (pending === 0) {
                        console.log('[cdn-world] upgraded ' + upgraded + ' world objects from CDN');
                    }
                });
            }

                console.log('[cdn-world] no matching world objects to upgrade');
            }

        // ============================================================
        // TERRAIN FLATTENING — push planet vertices to a flat plane
        // under large structures so they don't balance on the curve.
        // Runs once at world-build time, modifies planetGeo directly.
        // Only flattens under objects above a size threshold.
        // ============================================================
        function flattenTerrainUnderObjects() {
            const MIN_SIZE_TO_FLATTEN = 3;  // only flatten under objects > 3m
            const pAttr = planetGeo.getAttribute('position');
            const targets = [];

            // Collect large objects and their lat/lon + radius
            for (const obj of world.all) {
                if (!obj.pos) continue;
                if (obj.category === 'vegetation' && obj.type !== 'palm') continue;
                // Use the rules radius or object scale as a size hint
                const rules = getRules(obj.type);
                const objRadius = (rules.radius || 1) * (obj._intendedFinalScale || 1) * 0.5;
                if (objRadius < MIN_SIZE_TO_FLATTEN) continue;

                const center = obj.pos.clone().normalize();
                const groundR = obj.pos.length();
                targets.push({ center, groundR, radius: objRadius * 1.2 });
            }

            if (targets.length === 0) return;

            // For each vertex, check if it's near a flatten target.
            // If so, set its radius to match the target's groundR (flat pad).
            const v = new THREE.Vector3();
            let modified = 0;
            for (let i = 0; i < pAttr.count; i++) {
                v.set(pAttr.getX(i), pAttr.getY(i), pAttr.getZ(i));
                const vDir = v.clone().normalize();
                const vR = v.length();

                for (const t of targets) {
                    // Angular distance between vertex and object center
                    const angDist = Math.acos(Math.max(-1, Math.min(1, vDir.dot(t.center))));
                    const surfDist = angDist * PR;

                    if (surfDist < t.radius) {
                        // Smoothly blend: center of pad is fully flat,
                        // edges blend back to natural terrain
                        const blend = surfDist / t.radius;
                        const smoothBlend = blend * blend;  // quadratic falloff
                        const flatR = t.groundR;
                        const newR = flatR * (1 - smoothBlend) + vR * smoothBlend;
                        const scaled = vDir.multiplyScalar(newR);
                        pAttr.setXYZ(i, scaled.x, scaled.y, scaled.z);
                        modified++;
                        break;  // one flatten target per vertex is enough
                    }
                }
            }

            pAttr.needsUpdate = true;
            planetGeo.computeVertexNormals();
            console.log('[terrain] flattened ' + modified + ' vertices under ' + targets.length + ' large objects');
        }
        flattenTerrainUnderObjects();

        // v4: Snap EVERY world object to the actual planet mesh surface.
        // Procedural objects are placed via analytical groundHeight() which
        // diverges from the rendered mesh by up to 18% on slopes. This one-
        // time pass corrects all of them.
        function snapAllObjectsToMesh() {
            const ray = new THREE.Raycaster();
            let snapped = 0;
            for (const obj of world.all) {
                if (!obj.mesh || !obj.pos) continue;
                const dir = obj.mesh.position.clone().normalize();
                ray.set(dir.clone().multiplyScalar(PR + 25), dir.clone().negate());
                ray.far = 50;
                const hits = ray.intersectObject(planet);
                if (hits.length > 0) {
                    // Preserve the object's height offset (sink) by measuring
                    // how far above/below the analytical position it was
                    const analyticalR = obj.pos.length();
                    const meshR = hits[0].point.length();
                    const currentR = obj.mesh.position.length();
                    const offset = currentR - analyticalR;
                    obj.mesh.position.copy(dir.multiplyScalar(meshR + offset));
                    snapped++;
                }
            }
            console.log('[v4] snapped ' + snapped + ' objects to mesh surface');
        }
        snapAllObjectsToMesh();
