        // ------------------------------------------------------------
        // EXPRESSION SYSTEM — playOneShot()
        // ------------------------------------------------------------
        // Play a non-looping animation clip ONCE, overriding the state
        // machine in animChar() until it finishes (or holdMs elapses).
        // Used for photo/selfie reactions, greetings, manual emotes,
        // and the boredom emote loop.
        //
        // Safe to call when the GLB isn't loaded — silently noops on the
        // procedural fallback character.
        // ------------------------------------------------------------
        // Emote name aliases — when the active model doesn't have a clip
        // named exactly what the keybind requests, fall through to a
        // synonym. Lets keys like T (Dance) work on HVGirl (which uses
        // 'Samba') and similar.
        const EMOTE_ALIASES = {
            'Dance':    ['Dance', 'Samba'],
            'Wave':     ['Wave', 'Greeting', 'Hello'],
            'Yes':      ['Yes', 'Nod'],
            'No':       ['No', 'Shake'],
            'ThumbsUp': ['ThumbsUp', 'Approve'],
        };
        // Pick the first available clip from a preference list.
        // Used by the state machine to be tolerant of different naming
        // conventions (Idle vs idle, Running vs sprint, etc.).
        function _pickStateClip(glb, candidates) {
            if (!glb || !glb.actions) return null;
            for (const n of candidates) if (glb.actions[n]) return n;
            return null;
        }

        function _resolveClipName(name) {
            const u = character.userData.glb;
            if (!u) return null;
            if (u.actions[name]) return name;
            const aliases = EMOTE_ALIASES[name];
            if (!aliases) return null;
            for (const alt of aliases) if (u.actions[alt]) return alt;
            return null;
        }

        // ------------------------------------------------------------
        // TAUNT KEY — cycle through whatever non-movement clips this
        // character actually has. Different models have wildly different
        // clip sets (Robot has 14, HVGirl has Samba, CesiumMan has nothing
        // playable as a taunt). Each character keeps its own cycle index,
        // so pressing B repeatedly walks through their available taunts.
        // ------------------------------------------------------------
        // Clips that are movement / state and should NOT count as taunts
        const _MOVEMENT_CLIPS = new Set([
            // Caps-based names (RobotExpressive, HVGirl)
            'Idle', 'Walking', 'Walk', 'Running', 'Run', 'Jump', 'WalkJump',
            'WalkingBack', 'Survey', 'Death', 'animation_0',
            // Lowercase names (Kenney starter-kit characters)
            'idle', 'walk', 'sprint', 'run', 'jump', 'fall', 'crouch',
            'die', 'static', 'drive', 'pick-up',
            // Holding/wheelchair state clips (Kenney Soldier) — state, not taunts
            'holding-right', 'holding-left', 'holding-both',
            'holding-right-shoot', 'holding-left-shoot', 'holding-both-shoot',
            'wheelchair-sit', 'wheelchair-look-left', 'wheelchair-look-right',
            'wheelchair-move-forward', 'wheelchair-move-back',
            'wheelchair-move-left', 'wheelchair-move-right',
        ]);
        function _getTauntsForCurrentCharacter() {
            const u = character.userData.glb;
            if (!u || !u.actions) return [];
            // Cache the list per character.userData.glb instance so the
            // index is stable while the same character is loaded
            if (u.taunts) return u.taunts;
            const all = Object.keys(u.actions);
            u.taunts = all.filter(n => !_MOVEMENT_CLIPS.has(n));
            u.tauntIdx = 0;
            return u.taunts;
        }

        function cycleTaunt() {
            const u = character.userData.glb;
            if (!u) return false;
            const taunts = _getTauntsForCurrentCharacter();
            if (taunts.length === 0) {
                _showMCToast('No taunts');
                return false;
            }
            const next = taunts[u.tauntIdx % taunts.length];
            u.tauntIdx = (u.tauntIdx + 1) % taunts.length;
            _showMCToast(next);
            playOneShot(next);
            return true;
        }

        function playOneShot(name, holdMs) {
            const u = character.userData.glb;
            if (!u) return false;
            const resolved = _resolveClipName(name);
            if (!resolved) return false;
            name = resolved;
            const action = u.actions[name];
            const prev = u.currentAction && u.currentAction !== name ? u.actions[u.currentAction] : null;

            action.reset();
            action.setLoop(THREE.LoopOnce, 1);
            action.clampWhenFinished = true;
            if (prev) prev.fadeOut(0.15);
            action.fadeIn(0.15).play();

            u.oneShot = name;
            u.oneShotUntil = performance.now() + (holdMs || action.getClip().duration * 1000);
            u.currentAction = name;
            // Any deliberate emote also resets the idle timer (player just "did something")
            player.lastActiveTime = performance.now();
            return true;
        }

        // Pick a random emote from a list of clip names that the loaded model has.
        function playRandomEmote(emotes) {
            const u = character.userData.glb;
            if (!u) return;
            const available = emotes.filter(n => u.actions[n]);
            if (available.length === 0) return;
            const pick = available[Math.floor(Math.random() * available.length)];
            playOneShot(pick);
        }

        // ------------------------------------------------------------
        // ENTRANCE RITUAL
        // ------------------------------------------------------------
        // The character turns to face the camera, waves hello, and
        // turns back. Input is blocked during the ritual. The visual
        // 180° flip is applied to the GLB pivot so the orientation
        // matrix (and therefore the camera) is untouched — only the
        // visible mesh rotates. Falls back to a no-op if the GLB
        // hasn't loaded yet (procedural fallback character has no
        // pivot, no Wave clip).
        // ------------------------------------------------------------
        // Phase durations (seconds) — kept tight so the player isn't held
        // out of control for long. Total ≈ 2.6s.
        const RITUAL_TURN_IN  = 0.25;
        const RITUAL_WAVE     = 1.40;
        const RITUAL_TURN_OUT = 0.25;
        const RITUAL_TOTAL    = RITUAL_TURN_IN + RITUAL_WAVE + RITUAL_TURN_OUT;
        // Wave clip is naturally ~2.5s; speed it up so a satisfying portion
        // plays inside RITUAL_WAVE without looking truncated.
        const RITUAL_WAVE_SPEED = 1.35;

        function startEntranceRitual() {
            const u = character.userData.glb;
            if (!u || !u.pivot) return false;     // procedural fallback — skip
            player.ritualActive = true;
            player.ritualStartTime = performance.now();
            player.ritualWavePlayed = false;
            // Force inputs to zero on entry so a held key doesn't carry through
            player.vFwd = 0;
            player.vStrafe = 0;
            // Mark any landmarks the player is already standing next to as
            // "visited" — otherwise the first-visit Wave hook in updateHUD
            // would fire for the starting landmark right after the ritual
            // ends, giving the player a duplicate hello.
            for (const lm of world.landmarks) {
                if (player.groundPos.distanceTo(lm.pos) < 25) {
                    _visitedLandmarks.add(lm.name);
                }
            }
            return true;
        }

        // Cubic ease in/out — gentle start, gentle finish
        function _easeInOut(t) {
            return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
        }

        // Drop shadow — a dark ellipse on the ground under the character.
        // This is the #1 visual cue that tells the eye the character
        // is touching the ground. Without it, spherical curvature
        // creates an illusion of floating.
        const shadowGeo = new THREE.CircleGeometry(0.5, 16);
        shadowGeo.rotateX(-Math.PI / 2);
        const shadowMat = new THREE.MeshBasicMaterial({
            color: 0x000000, transparent: true, opacity: 0.25,
            depthWrite: false
        });
        const charShadow = new THREE.Mesh(shadowGeo, shadowMat);
        charShadow.visible = false; // only visible in debug mode (F3)
        scene.add(charShadow);

        // ============================================================
        // PLAYER STATE — mesh-grounded surface walker
        //
        // The character LIVES ON the mesh. Its position is always a
        // point ON or above the planet mesh surface. Its orientation
        // comes from the mesh face normal, not a mathematical sphere.
        //
        // Core state:
        //   groundPos  — the contact point on the mesh surface (Vector3)
        //   groundNorm — the mesh face normal at that point (Vector3)
        //   heading    — facing angle in the tangent plane (radians)
        //   airborne   — height above groundPos along groundNorm
        //   vAir       — vertical velocity when airborne
        // ============================================================

        const player = {
            groundPos:  new THREE.Vector3(),
            groundNorm: new THREE.Vector3(0, 1, 0),
            heading: 0,
            airborne: 0,
            vAir: 0,
            vFwd: 0,
            vTurn: 0,
            grounded: true,
            wasGrounded: true,
            selfieMode: false,
            stepPhase: 0,
            landTimer: 0,
            jumpTimer: 0,
            // Entrance ritual — when true, input is blocked and animChar
            // runs the turn-toward-camera-wave-turn-back sequence.
            ritualActive: false,
            ritualStartTime: 0,
            ritualWavePlayed: false,
            // Effective character height in world units. Defaults to CH but
            // is overridden by loadMCFromCharacter when the player picks a
            // scale variant (e.g. Robo Tot at 0.65×). Camera and HUD read
            // this so they re-frame around the actual visible head.
            charHeight: CH,
        };

        function snapToSurface(dir) {
            const n = dir.clone().normalize();
            const r = groundHeight(n.x, n.y, n.z);
            return { point: n.clone().multiplyScalar(r), normal: n.clone() };
        }

        // Initialize player in an empty grassland area (away from all zones)
        {
            const phi = (90 - 30) * Math.PI / 180, theta = (180 + 180) * Math.PI / 180;
            const dir = new THREE.Vector3(Math.sin(phi) * Math.cos(theta), Math.cos(phi), Math.sin(phi) * Math.sin(theta));
            const hit = snapToSurface(dir);
            player.groundPos.copy(hit.point);
            player.groundNorm.copy(hit.normal);
        }

        // Persistent forward reference — survives pole crossings.
        // Projected into the current tangent plane each frame.
        const _lastFwRef = new THREE.Vector3(0, 0, 1);

        function getFrame() {
            const up = player.groundPos.clone().normalize();

            // Project the previous forward reference into the current tangent plane
            let ref = _lastFwRef.clone().sub(up.clone().multiplyScalar(_lastFwRef.dot(up)));
            if (ref.lengthSq() < 0.0001) {
                // Degenerate — pick any tangent
                const seed = Math.abs(up.y) < 0.95 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
                ref = seed.sub(up.clone().multiplyScalar(seed.dot(up)));
            }
            ref.normalize();

            // ref is the "north" in the tangent plane — continuous across the sphere
            const east = new THREE.Vector3().crossVectors(up, ref).normalize();
            const fw = ref.clone().multiplyScalar(Math.cos(player.heading))
                        .add(east.clone().multiplyScalar(Math.sin(player.heading))).normalize();
            const rt = new THREE.Vector3().crossVectors(fw, up).normalize();

            // Store the reference (without heading rotation) for next frame
            _lastFwRef.copy(ref);

            return { up, fw, rt };
        }

        function getLatLon() {
            const p = player.groundPos.clone().normalize();
            return {
                lat: Math.asin(Math.max(-1, Math.min(1, p.y))) * 180 / Math.PI,
                lon: Math.atan2(p.z, p.x) * 180 / Math.PI
            };
        }


        // ============================================================
        // CHARACTER GROUNDING — analytical, zero jitter, zero cost
        //
        // The planet mesh is smooth-shaded. The rendered surface visually
        // follows the smooth interpolation between displaced vertices.
        // groundHeight() is the same continuous function that displaced
        // those vertices. So the character follows the same curve the
        // eye sees — no mismatch, no edges, no raycasting needed.
        // ============================================================
        // (surface normal computation removed — caused tilt/spiral bugs)

        // Single raycaster reused each frame for character grounding
        const _charRay = new THREE.Raycaster();

        function updateChar() {
            const dir = player.groundPos.clone().normalize();

            // Find the ground: planet mesh
            _charRay.set(dir.clone().multiplyScalar(PR + 25), dir.clone().negate());
            _charRay.far = 50;
            const planetHits = _charRay.intersectObject(planet);
            let groundR = planetHits.length > 0 ? planetHits[0].point.length() : groundHeight(dir.x, dir.y, dir.z);

            // Build mesh lists once, force world matrix update
            if (!window._solidMeshes || window._solidMeshes.length === 0) {
                window._solidMeshes = [];
                window._walkableMeshes = [];
                for (const obj of world.all) {
                    if (!obj.pos) continue;
                    const rules = getRules(obj.type);
                    if (rules.solid && obj.collision) {
                        obj.mesh.updateMatrixWorld(true);
                        window._solidMeshes.push(obj.mesh);
                    }
                    if (obj.category !== 'vegetation' && (rules.solid || rules.walkable) && obj.mesh) {
                        obj.mesh.updateMatrixWorld(true);
                        window._walkableMeshes.push(obj.mesh);
                    }
                }
                console.log('Solid meshes:', window._solidMeshes.length, 'Walkable:', window._walkableMeshes.length);
            }

            // Check for landable object surfaces below MC
            let landingR = groundR;
            let onObject = false;

            if (player.airborne > 0.05 || player.onObject) {
                const mcWorldPos = dir.clone().multiplyScalar(groundR + player.airborne + 1);
                _charRay.set(mcWorldPos, dir.clone().negate());
                _charRay.far = player.airborne + 4;
                const objHits = _charRay.intersectObjects(window._walkableMeshes, true);

                for (const hit of objHits) {
                    if (!hit.face) continue;
                    // Accept any surface that faces even slightly outward (> 0.15)
                    const fn = hit.face.normal.clone().transformDirection(hit.object.matrixWorld).normalize();
                    if (fn.dot(dir) < 0.15) continue; // nearly vertical wall — skip

                    const surfR = hit.point.length();
                    if (surfR > landingR) {
                        landingR = surfR;
                        onObject = true;
                    }
                    break;
                }
            }

            // If was on object but now no valid surface found, fall
            if (player.onObject && !onObject && player.airborne > 0.1) {
                player.grounded = false;
            }

            // Head collision — when rising, check for solid objects above MC
            // If hit, stop upward velocity and start falling from that point
            if (player.vAir > 0) {
                const headPos = dir.clone().multiplyScalar(groundR + player.airborne + CH);
                _charRay.set(headPos, dir.clone()); // ray points outward (up from surface)
                _charRay.far = player.vAir * 2 + 1; // search distance based on upward speed
                const ceilingHits = _charRay.intersectObjects(window._walkableMeshes, true);
                if (ceilingHits.length > 0) {
                    // Hit a ceiling — stop rising, start falling
                    const ceilR = ceilingHits[0].point.length();
                    const maxAirborne = ceilR - groundR - CH; // head touches ceiling
                    if (player.airborne > maxAirborne - 0.1) {
                        player.airborne = Math.max(0, maxAirborne - 0.1);
                        player.vAir = 0; // bonk — stop rising
                    }
                }
            }

            // Set ground position to planet surface (for movement reference)
            player.groundPos.copy(dir.clone().multiplyScalar(groundR));

            const move = getFrame();

            // Gravity
            if (!player.grounded) player.vAir -= GRAVITY;
            player.airborne += player.vAir;

            // Landing check: MC feet at groundR + airborne, landing surface at landingR
            const feetR = groundR + player.airborne;
            if (feetR <= landingR) {
                player.airborne = landingR - groundR; // stand on the surface
                player.vAir = 0;
                player.grounded = true;
                player.onObject = onObject;
            }

            // Position
            const pos = dir.clone().multiplyScalar(groundR + player.airborne);
            character.position.copy(pos);

            // Stand straight up (radial). Simple, stable, no tilt bugs.
            const m = new THREE.Matrix4().makeBasis(move.rt.clone().negate(), move.up, move.fw);
            character.quaternion.setFromRotationMatrix(m);

            // Shadow sticks to ground surface, slightly above to avoid z-fighting
            charShadow.position.copy(player.groundPos.clone().add(move.up.clone().multiplyScalar(0.05)));
            charShadow.quaternion.copy(character.quaternion);

            return { pos, up: move.up, fw: move.fw, rt: move.rt.clone().negate() };
        }

        // Move the player along the planet surface with collision.
        const MC_RADIUS = 0.4;

        function moveOnSurface(fwdAmount, strafeAmount, turnAmount) {
            player.heading += turnAmount;
            if (Math.abs(fwdAmount) < 0.00001 && Math.abs(strafeAmount) < 0.00001) return;

            const frame = getFrame();
            const moveVec = frame.fw.clone().multiplyScalar(fwdAmount)
                .add(frame.rt.clone().negate().multiplyScalar(strafeAmount));
            const newWorldPos = player.groundPos.clone().add(moveVec);
            const dir = newWorldPos.normalize();
            const r = groundHeight(dir.x, dir.y, dir.z);
            const candidatePos = new THREE.Vector3(dir.x * r, dir.y * r, dir.z * r);

            // COLLISION — mesh raycast against solid objects.
            // _solidMeshes built in updateChar() on first frame.

            player._collisions = 0;
            player._blockedBy = 'none';

            const moveDir = candidatePos.clone().sub(player.groundPos);
            const moveDist = moveDir.length();
            if (moveDist > 0.001) {
                moveDir.normalize();
                const up = player.groundPos.clone().normalize();
                const lateral = new THREE.Vector3().crossVectors(moveDir, up).normalize();

                // Base height: ground level + airborne (so rays work on rooftops too)
                const base = player.groundPos.clone().add(up.clone().multiplyScalar(player.airborne));

                // 9 rays: 3 heights x 3 lateral positions (center, left, right)
                const R = MC_RADIUS * 1.2; // slightly wider than MC body
                const rays = [];
                for (const h of [0.15, 0.6, 1.1]) {
                    for (const l of [0, R, -R]) {
                        rays.push(base.clone().add(up.clone().multiplyScalar(h)).add(lateral.clone().multiplyScalar(l)));
                    }
                }

                let closest = Infinity;
                for (const origin of rays) {
                    _charRay.set(origin, moveDir);
                    _charRay.far = moveDist + MC_RADIUS;
                    const hits = _charRay.intersectObjects(window._solidMeshes, true);
                    if (hits.length > 0 && hits[0].distance < closest) {
                        closest = hits[0].distance;
                    }
                }

                if (closest < moveDist + MC_RADIUS) {
                    player._collisions = 1;
                    player._blockedBy = 'mesh d=' + closest.toFixed(2);
                    const stop = Math.max(0, closest - MC_RADIUS);
                    const stopPos = player.groundPos.clone().add(moveDir.clone().multiplyScalar(stop));
                    const d2 = stopPos.normalize();
                    const r2 = groundHeight(d2.x, d2.y, d2.z);
                    candidatePos.set(d2.x * r2, d2.y * r2, d2.z * r2);
                }
            }

            player.groundPos.copy(candidatePos);
        }

        // ============================================================
        // INPUT
        // ============================================================
        const keys={};
        addEventListener('keydown', e=>{keys[e.code]=true; if(!e.metaKey&&!e.altKey&&!e.ctrlKey) e.preventDefault();});
        addEventListener('keyup', e=>{keys[e.code]=false;});

        let camPitch=0.3, camDist=12;  // v3: scaled for bigger planet
        // Camera mode: 1=first person, 2=close behind, 3=orbit (default)
        let camMode=3;
        let ptrLock=false;
        renderer.domElement.addEventListener('click', ()=>{ if(!ptrLock) renderer.domElement.requestPointerLock(); });
        document.addEventListener('pointerlockchange', ()=>{ ptrLock=document.pointerLockElement===renderer.domElement; });
        document.addEventListener('mousemove', e=>{
            if(ptrLock){
                // Mouse X turns the character (inverted: move mouse right = look right)
                player.heading -= e.movementX * 0.003;
                // Mouse Y pitches the camera (not in first person)
                if(camMode !== 1) camPitch=Math.max(0.05,Math.min(1.4,camPitch+e.movementY*0.003));
            }
        });
        addEventListener('wheel', e=>{ camDist=Math.max(3,Math.min(60,camDist+e.deltaY*0.01)); });
        // Camera mode switching: 1, 2, 3 keys
        addEventListener('keydown', e=>{
            if(e.code==='Digit1') camMode=1;
            if(e.code==='Digit2') camMode=2;
            if(e.code==='Digit3') camMode=3;
        });

        // ============================================================
        // CAMERA — direct tracking, no lag
        // ============================================================
        function updateCam(cs){
            const {pos,up,fw,rt}=cs;
            const headPos = pos.clone().add(up.clone().multiplyScalar((player.charHeight || CH) * 0.8));
            let cp, tgt;

            if(player.selfieMode){
                cp = pos.clone().add(fw.clone().multiplyScalar(4*WORLD_SCALE)).add(up.clone().multiplyScalar(2));
                tgt = headPos;
            } else if(camMode === 1){
                cp = headPos.clone().add(fw.clone().multiplyScalar(0.1));
                tgt = headPos.clone().add(fw.clone().multiplyScalar(10));
                character.visible = false;
            } else if(camMode === 2){
                character.visible = true;
                cp = headPos.clone().add(fw.clone().negate().multiplyScalar(2.5)).add(up.clone().multiplyScalar(0.8));
                tgt = headPos;
            } else {
                character.visible = true;
                cp = pos.clone()
                    .add(fw.clone().negate().multiplyScalar(Math.cos(camPitch) * camDist))
                    .add(up.clone().multiplyScalar(Math.sin(camPitch) * camDist));
                tgt = headPos;
            }

            camera.position.copy(cp);
            const cZ = tgt.clone().sub(cp).normalize();
            const cX = new THREE.Vector3().crossVectors(cZ, up).normalize();
            const cY = new THREE.Vector3().crossVectors(cX, cZ).normalize();
            const cm = new THREE.Matrix4().makeBasis(cX, cY, cZ.negate());
            cm.setPosition(cp);
            camera.matrixAutoUpdate = false;
            camera.matrix.copy(cm);
            camera.matrixWorldNeedsUpdate = true;
        }

        // ============================================================
        // MINIMAP
        // ============================================================
        const mmC=document.getElementById('minimap-canvas'), mmX=mmC.getContext('2d');
        function drawMinimap(){
            const w=120,h=120; mmX.clearRect(0,0,w,h);
            const{lat:pLat,lon:pLon}=getLatLon();
            mmX.beginPath(); mmX.arc(60,60,56,0,Math.PI*2); mmX.fillStyle='rgba(135,206,235,0.6)'; mmX.fill();
            for(let px=0;px<w;px+=3)for(let py=0;py<h;py+=3){
                const dx=(px-60)/56, dy=(py-60)/56;
                if(dx*dx+dy*dy>1)continue;
                const mLon=pLon+dx*40, mLat=pLat-dy*40;
                const phi=(90-mLat)*Math.PI/180, theta=(mLon+180)*Math.PI/180;
                const c=getBiomeColor(getBiome(Math.sin(phi)*Math.cos(theta), Math.cos(phi), Math.sin(phi)*Math.sin(theta)));
                mmX.fillStyle=`rgb(${c.r*255|0},${c.g*255|0},${c.b*255|0})`; mmX.fillRect(px,py,3,3);
            }
            for(const lm of world.landmarks){
                const dl=lm.lat-pLat, dn=lm.lon-pLon;
                if(Math.abs(dl)>40||Math.abs(dn)>40)continue;
                mmX.beginPath(); mmX.arc(60+(dn/40)*56, 60-(dl/40)*56, 2.5, 0, Math.PI*2);
                mmX.fillStyle='#ffd700'; mmX.fill();
            }
            mmX.beginPath(); mmX.arc(60,60,3.5,0,Math.PI*2); mmX.fillStyle='#ff6b6b'; mmX.fill();
            mmX.strokeStyle='#fff'; mmX.lineWidth=1.5; mmX.stroke();
        }

        // ============================================================
        // PHOTO SYSTEM
        // ============================================================
        let photoVis=false;
        function takePhoto(selfie=false){
            // Capture is wrapped so we can delay it for selfies (gives the
            // character time to strike a Wave pose before the snap).
            const doCapture = () => {
                if(selfie){
                    player.selfieMode=true; updateCam(updateChar());
            // v3: Distance-based visibility culling            // v3: Distance-based visibility culling — hide objects far from
            // the player to save GPU. Only render objects within renderRadius
            // units. Recalculated every frame (fast — just distance checks).
            {
                const _playerPos = character.position;
                const RENDER_RADIUS = 60;  // units — roughly quarter of the planet
                const RENDER_RADIUS_SQ = RENDER_RADIUS * RENDER_RADIUS;
                for (const obj of world.all) {
                    if (!obj.mesh || !obj.pos) continue;
                    const dx = obj.mesh.position.x - _playerPos.x;
                    const dy = obj.mesh.position.y - _playerPos.y;
                    const dz = obj.mesh.position.z - _playerPos.z;
                    obj.mesh.visible = (dx*dx + dy*dy + dz*dz) < RENDER_RADIUS_SQ;
                }
                // Moon is always visible (orbits far beyond cull radius)
                if (typeof moonGroup !== 'undefined') moonGroup.visible = true;
            }
            renderer.render(scene,camera); player.selfieMode=false; updateCam(updateChar());
                }
                document.getElementById('flash').classList.add('active');
                setTimeout(()=>document.getElementById('flash').classList.remove('active'),150);
                const pc=document.getElementById('photo-canvas'), cx=pc.getContext('2d');
                cx.drawImage(renderer.domElement,0,0,640,400);
                if(selfie){cx.fillStyle='rgba(255,255,255,0.7)';cx.font='13px sans-serif';cx.fillText('Selfie',570,22);}
                cx.fillStyle='rgba(0,0,0,0.4)';cx.font='11px monospace';cx.fillText(new Date().toLocaleString(),8,392);
                document.getElementById('photo-caption').textContent=(selfie?'Selfie':'Photo')+' at '+document.getElementById('location-name').textContent;
                document.getElementById('photo-frame').classList.add('visible'); photoVis=true;
            };

            if (selfie) {
                // Selfie: trigger Wave first so the snap captures the pose mid-clip.
                playOneShot('Wave');
                setTimeout(doCapture, 700);
            } else {
                // Photo: capture immediately, then react with a thumbs-up.
                doCapture();
                playOneShot('ThumbsUp');
            }
        }
        window.closePhoto=()=>{document.getElementById('photo-frame').classList.remove('visible');photoVis=false;};
        window.savePhoto=()=>{const a=document.createElement('a');a.download='blue-marble-'+Date.now()+'.png';a.href=document.getElementById('photo-canvas').toDataURL();a.click();};
        document.getElementById('photo-btn').addEventListener('click',e=>{e.stopPropagation();takePhoto(false);});
        document.getElementById('selfie-btn').addEventListener('click',e=>{e.stopPropagation();takePhoto(true);});
        addEventListener('keydown',e=>{
            // Always allow Escape (close photo). Everything else is gated
            // by ritualActive so the entrance can't be interrupted.
            if(e.code==='Escape'&&photoVis){closePhoto();return;}
            if(player.ritualActive)return;
            if(e.code==='KeyP'&&!photoVis)takePhoto(false);
            if(e.code==='KeyO'&&!photoVis)takePhoto(true);
            // Manual emotes — only fire on the initial keydown, not on repeat
            if (e.repeat) return;
            if (e.code === 'KeyE') playOneShot('Wave');
            if (e.code === 'KeyT') playOneShot('Dance');
            if (e.code === 'KeyY') playOneShot('Yes');
            if (e.code === 'KeyN') playOneShot('No');
            if (e.code === 'KeyM') cycleMCCharacter();
            if (e.code === 'KeyC') cycleMCColor();
            if (e.code === 'KeyB') cycleTaunt();
        });

        // ============================================================
        // HUD
        // ============================================================
        function nearest(){
            let n=null,d=Infinity;
            for(const l of world.landmarks){
                const dd=character.position.distanceTo(l.pos);
                if(dd<d){d=dd;n=l;}
            }
            return {lm:n,dist:d};
        }
        const _visitedLandmarks = new Set();
        function updateHUD(){
            const{lm,dist}=nearest();
            const{lat,lon}=getLatLon();
            const u=player.groundPos.clone().normalize();
            const b=getBiome(u.x,u.y,u.z);
            let loc=b.name;
            if(dist<25)loc=lm.name; else if(dist<50)loc='Near '+lm.name;
            // First time the player gets close to a landmark, the character waves.
            // Suppressed during the entrance ritual (which has its own wave) and
            // before the entrance ritual has run at all — this prevents a stray
            // hello-wave for whatever landmark the player happens to spawn next to.
            if (lm && dist < 25 && !_visitedLandmarks.has(lm.name)
                && !player.ritualActive && player.ritualStartTime > 0) {
                _visitedLandmarks.add(lm.name);
                playOneShot('Wave');
            }
            document.getElementById('location-name').textContent=loc;
            document.getElementById('coords-display').textContent=
                `${Math.abs(lat).toFixed(1)}\u00B0${lat>=0?'N':'S'}, ${Math.abs(lon).toFixed(1)}\u00B0${lon>=0?'E':'W'}`;
            const icons=['\u{1F30A}','\u{1F33F}','\u{1F332}','\u{1F3DC}\uFE0F','\u2744\uFE0F','\u{1F334}','\u{1F3D6}\uFE0F'];
            document.getElementById('biome-indicator').textContent=icons[b.type]+' '+b.name;
        }

        // ============================================================
        // CHARACTER ANIMATION (velocity-driven, physically motivated)
        // ============================================================
        function animChar(dt, t) {
            const u = character.userData;
            const speed = Math.abs(player.vFwd);
            const speedNorm = speed / MAX_RUN;  // 0..1
            const turnNorm = player.vTurn / MAX_TURN;

            // ---- GLB animation path -------------------------------
            // If a pre-rigged character is loaded, drive its AnimationMixer
            // from the player state and skip the per-bone procedural rig.
            if (u.glb) {
                u.glb.mixer.update(dt);

                // ENTRANCE RITUAL — runs before everything else.
                // Visually rotates the pivot 180° so the character faces
                // the camera, waves, then rotates back. Returns early so
                // the state machine and one-shot bypass don't fight us.
                if (player.ritualActive) {
                    const elapsed = (performance.now() - player.ritualStartTime) / 1000;
                    const pivot = u.glb.pivot;

                    if (elapsed < RITUAL_TURN_IN) {
                        // Phase 1: rotate pivot 0 → π (face the camera)
                        pivot.rotation.y = Math.PI * _easeInOut(elapsed / RITUAL_TURN_IN);
                    } else if (elapsed < RITUAL_TURN_IN + RITUAL_WAVE) {
                        // Phase 2: hold facing the camera + play Wave once
                        pivot.rotation.y = Math.PI;
                        if (!player.ritualWavePlayed) {
                            player.ritualWavePlayed = true;
                            playOneShot('Wave', RITUAL_WAVE * 1000);
                            // Speed up the wave clip so it feels alive in the
                            // shorter window. Restored to 1.0 in the cleanup
                            // branch below.
                            const waveAction = u.glb.actions['Wave'];
                            if (waveAction) waveAction.timeScale = RITUAL_WAVE_SPEED;
                        }
                    } else if (elapsed < RITUAL_TOTAL) {
                        // Phase 3: rotate pivot π → 0 (face forward again)
                        const t = (elapsed - RITUAL_TURN_IN - RITUAL_WAVE) / RITUAL_TURN_OUT;
                        pivot.rotation.y = Math.PI * (1 - _easeInOut(t));
                    } else {
                        // Done — restore everything and hand control back
                        pivot.rotation.y = 0;
                        player.ritualActive = false;
                        player.ritualWavePlayed = false;
                        player.lastActiveTime = performance.now(); // reset boredom timer
                        // Clear any leftover one-shot state from the wave
                        u.glb.oneShot = null;
                        u.glb.oneShotUntil = 0;
                        // Restore the wave clip's timeScale so future Wave
                        // emotes (manual E key, landmark hello) play normally.
                        const waveAction = u.glb.actions['Wave'];
                        if (waveAction) waveAction.timeScale = 1;
                    }

                    // Landing squash still applies (in case ritual fires mid-jump,
                    // though it currently only fires from a stationary start)
                    if (player.landTimer > 0) {
                        player.landTimer -= dt;
                        const squash = Math.max(0, player.landTimer / 0.2);
                        const sq = 1 - squash * 0.15, st = 1 + squash * 0.08;
                        character.scale.set(st, sq, st);
                    } else {
                        character.scale.x += (1 - character.scale.x) * 0.15;
                        character.scale.y += (1 - character.scale.y) * 0.15;
                        character.scale.z += (1 - character.scale.z) * 0.15;
                    }
                    return;
                }

                // Combined linear speed (forward + strafe) so sideways
                // movement also triggers a walk cycle.
                const strafeSpeed = Math.abs(player.vStrafe || 0);
                const linearSpeed = Math.sqrt(speed * speed + strafeSpeed * strafeSpeed);

                // "Turning in place" — heading change > ~0.5°/frame at 60 fps
                const isTurning = (player.headingDelta || 0) > 0.009;

                // Track when the player was last "active" (any meaningful
                // movement, turning, or in air). Idle emote loop reads this.
                const isActive = !player.grounded || linearSpeed > 0.01 || isTurning;
                if (isActive) player.lastActiveTime = performance.now();

                const now = performance.now();

                // ONE-SHOT EXPRESSION OVERRIDE
                // While a one-shot is playing, freeze the state machine.
                // BUT — if the player starts moving, cancel the one-shot
                // (we don't want to be stuck mid-Dance during a sprint).
                if (u.glb.oneShot) {
                    if (now >= u.glb.oneShotUntil || (isActive && linearSpeed > 0.05)) {
                        // expired or interrupted by motion — fall through to state machine
                        u.glb.oneShot = null;
                    } else {
                        // still playing — apply landing squash and bail
                        if (player.landTimer > 0) {
                            player.landTimer -= dt;
                            const squash = Math.max(0, player.landTimer / 0.2);
                            const sq = 1 - squash * 0.15, st = 1 + squash * 0.08;
                            character.scale.set(st, sq, st);
                        } else {
                            character.scale.x += (1 - character.scale.x) * 0.15;
                            character.scale.y += (1 - character.scale.y) * 0.15;
                            character.scale.z += (1 - character.scale.z) * 0.15;
                        }
                        if (!player.grounded) player.jumpTimer += dt;
                        else player.jumpTimer = 0;
                        return;
                    }
                }

                // BOREDOM EMOTES — if the player has been idle for a while,
                // occasionally play a random expression. Resets on any motion.
                if (!isActive && (now - (player.lastActiveTime || now)) > 18000) {
                    playRandomEmote(['Wave', 'ThumbsUp', 'Yes', 'Dance']);
                    // The playOneShot above sets lastActiveTime, so the next
                    // boredom trigger is ~18s after THIS emote ends.
                }

                // Pick clip from current state. Different rigs use
                // different name conventions (RobotExpressive uses 'Idle';
                // Kenney uses 'idle'; HVGirl uses 'Idle' but no 'Running').
                // _pickStateClip tries a list of synonyms and returns the
                // first one the model actually has.
                let target;
                if (!player.grounded)                       target = _pickStateClip(u.glb, ['Jump','jump','WalkJump']);
                else if (linearSpeed > MAX_WALK * 0.6)      target = _pickStateClip(u.glb, ['Running','Run','sprint','run','Walking','walk']);
                else if (linearSpeed > 0.01 || isTurning)   target = _pickStateClip(u.glb, ['Walking','Walk','walk']);
                else                                        target = _pickStateClip(u.glb, ['Idle','idle','Survey','static']);

                // Freeze mixer when stationary if no idle-like clip exists
                const wantsIdle = linearSpeed <= 0.01 && !isTurning && player.grounded;
                if (wantsIdle && !target) {
                    u.glb.mixer.timeScale = 0;
                } else {
                    u.glb.mixer.timeScale = 1;
                }

                if (!target) {
                    target = u.glb.currentAction || Object.keys(u.glb.actions)[0];
                }

                if (target !== u.glb.currentAction && u.glb.actions[target]) {
                    const next = u.glb.actions[target];
                    const prev = u.glb.currentAction ? u.glb.actions[u.glb.currentAction] : null;
                    next.reset().fadeIn(0.2).play();
                    if (prev) prev.fadeOut(0.2);
                    u.glb.currentAction = target;
                }

                // Landing squash still applies via the parent group's scale
                if (player.landTimer > 0) {
                    player.landTimer -= dt;
                    const squash = Math.max(0, player.landTimer / 0.2);
                    const sq = 1 - squash * 0.15;
                    const st = 1 + squash * 0.08;
                    character.scale.set(st, sq, st);
                } else {
                    character.scale.x += (1 - character.scale.x) * 0.15;
                    character.scale.y += (1 - character.scale.y) * 0.15;
                    character.scale.z += (1 - character.scale.z) * 0.15;
                }

                if (!player.grounded) player.jumpTimer += dt;
                else player.jumpTimer = 0;
                return;
            }
            // ---- end GLB path -------------------------------------

            // Walk cycle driven by actual velocity, not input
            if (speed > 0.001) {
                // Step frequency increases with speed
                player.stepPhase += dt * (6 + speedNorm * 10);
                const s = Math.sin(player.stepPhase);
                const c = Math.cos(player.stepPhase);

                // Leg swing amplitude scales with speed
                const legSwing = 0.25 + speedNorm * 0.35;
                u.lLeg.rotation.x = s * legSwing;
                u.rLeg.rotation.x = -s * legSwing;
                u.lBoot.position.y = 0.08 + Math.max(0, s) * 0.04 * speedNorm;
                u.rBoot.position.y = 0.08 + Math.max(0, -s) * 0.04 * speedNorm;

                // Arms swing opposite, amplitude with speed
                const armSwing = 0.15 + speedNorm * 0.25;
                u.lArm.rotation.x = -s * armSwing;
                u.rArm.rotation.x = s * armSwing;

                // Head bob (vertical + slight forward lean with speed)
                u.head.position.y = 1.42 + Math.abs(s) * 0.015 * speedNorm;

                // Body leans forward proportional to speed
                u.body.rotation.x = speedNorm * 0.12;
                // Backward lean when walking backward
                if (player.vFwd < 0) u.body.rotation.x = -speedNorm * 0.08;

                // Body tilts into turns
                u.body.rotation.z = -turnNorm * 0.12;
            } else {
                // Idle — gentle breathing
                player.stepPhase = 0;
                u.head.position.y = 1.42 + Math.sin(t * 2) * 0.006;
                u.body.rotation.x *= 0.9;
                u.body.rotation.z *= 0.9;
                // Ease limbs back smoothly
                const ease = Math.pow(0.05, dt); // frame-rate independent easing
                u.lLeg.rotation.x *= ease;
                u.rLeg.rotation.x *= ease;
                u.lArm.rotation.x *= ease;
                u.rArm.rotation.x *= ease;
                u.lBoot.position.y += (0.08 - u.lBoot.position.y) * (1 - ease);
                u.rBoot.position.y += (0.08 - u.rBoot.position.y) * (1 - ease);
            }

            // Landing squash-and-stretch
            if (player.landTimer > 0) {
                player.landTimer -= dt;
                const squash = Math.max(0, player.landTimer / 0.2);
                const sq = 1 - squash * 0.15;
                const st = 1 + squash * 0.08;
                character.scale.set(st, sq, st);
            } else {
                // Ease scale back to 1
                character.scale.x += (1 - character.scale.x) * 0.15;
                character.scale.y += (1 - character.scale.y) * 0.15;
                character.scale.z += (1 - character.scale.z) * 0.15;
            }

            // In-air pose
            if (!player.grounded) {
                player.jumpTimer += dt;
                // Tuck legs slightly in air
                const tuck = Math.min(player.jumpTimer * 3, 1) * 0.3;
                u.lLeg.rotation.x = -tuck;
                u.rLeg.rotation.x = -tuck;
                // Arms out slightly
                u.lArm.rotation.z = tuck * 0.5;
                u.rArm.rotation.z = -tuck * 0.5;
            } else {
                u.lArm.rotation.z = u.lArm.rotation.z * 0.85;
                u.rArm.rotation.z = u.rArm.rotation.z * 0.85;
                player.jumpTimer = 0;
            }
        }

        // ============================================================
        // MAIN LOOP
        // ============================================================
        let lt=performance.now(), mmT=0, hudT=0;

        // v3: Camera occlusion — objects blocking the view fade out
        const _occRay = new THREE.Raycaster();
        const _occluded = new Set();

let _occFrame = 0;
        let _occCandidates = [];
        // Map each mesh → its root obj.mesh Group, so when one mesh is
        // hit we can fade the entire object (temple = columns+roof+base)
        let _meshToRoot = new Map();

        function _fadeMeshes(rootGroup, fade) {
            rootGroup.traverse(function(n) {
                if (!n.isMesh || !n.material) return;
                var mats = Array.isArray(n.material) ? n.material : [n.material];
                for (var i = 0; i < mats.length; i++) {
                    var mat = mats[i];
                    if (fade) {
                        if (mat._sOp === undefined) {
                            mat._sOp = mat.opacity;
                            mat._sTr = mat.transparent;
                            mat._sDw = mat.depthWrite;
                        }
                        mat.transparent = true;
                        mat.opacity = 0.08;
                        mat.depthWrite = false;
                    } else {
                        if (mat._sOp !== undefined) {
                            mat.opacity = mat._sOp;
                            mat.transparent = mat._sTr;
                            mat.depthWrite = mat._sDw;
                            delete mat._sOp;
                            delete mat._sTr;
                            delete mat._sDw;
                        }
                    }
                    mat.needsUpdate = true;
                }
            });
        }

        function updateCameraOcclusion() {
            var camPos = camera.position;
            var charPos = character.position;
            var mainDir = charPos.clone().sub(camPos);
            var dist = mainDir.length();
            if (dist < 0.5) return;
            mainDir.normalize();

            var up = new THREE.Vector3(0, 1, 0);
            var right = new THREE.Vector3().crossVectors(mainDir, up).normalize();
            var spread = 0.2;
            var rays = [
                mainDir.clone(),
                mainDir.clone().add(right.clone().multiplyScalar(spread)).normalize(),
                mainDir.clone().add(right.clone().multiplyScalar(-spread)).normalize(),
                mainDir.clone().add(up.clone().multiplyScalar(spread * 0.7)).normalize(),
                mainDir.clone().add(up.clone().multiplyScalar(-spread * 0.7)).normalize(),
            ];

            // Rebuild candidate list + mesh→root map periodically
            _occFrame++;
            if (_occFrame % 60 === 1 || _occCandidates.length === 0) {
                _occCandidates = [];
                _meshToRoot.clear();
                for (var oi = 0; oi < world.all.length; oi++) {
                    var obj = world.all[oi];
                    if (!obj.mesh || !obj.mesh.visible) continue;
                    var rootGroup = obj.mesh;
                    rootGroup.traverse(function(n) {
                        if (!n.isMesh) return;
                        if (n === planet) return;
                        // Skip character
                        var p = n.parent;
                        while (p) { if (p === character) return; p = p.parent; }
                        _occCandidates.push(n);
                        _meshToRoot.set(n, rootGroup);
                    });
                }
            }

            if (_occCandidates.length === 0) return;

            // Cast rays, collect the ROOT GROUPS that are blocking (not individual meshes)
            var blockedRoots = new Set();
            for (var r = 0; r < rays.length; r++) {
                _occRay.set(camPos, rays[r]);
                _occRay.far = dist - 0.2;
                var hits = _occRay.intersectObjects(_occCandidates, false);
                for (var h = 0; h < hits.length; h++) {
                    var root = _meshToRoot.get(hits[h].object);
                    if (root) blockedRoots.add(root);
                }
            }

            // Fade entire root groups that are blocking
            blockedRoots.forEach(function(root) {
                if (!_occluded.has(root)) _fadeMeshes(root, true);
            });

            // Restore root groups no longer blocking
            _occluded.forEach(function(root) {
                if (!blockedRoots.has(root)) _fadeMeshes(root, false);
            });

            _occluded.clear();
            blockedRoots.forEach(function(root) { _occluded.add(root); });
        }

                function animate(){
            requestAnimationFrame(animate);
            const now=performance.now(), dt=Math.min((now-lt)/1000,0.05), t=now*0.001;
            lt=now;

            // --- SURFACE-BASED MOVEMENT ---
            // Query environment at MC position for movement modifiers
            const _pDir = player.groundPos.clone().normalize();
            const _env = ENV.query(_pDir.x, _pDir.y, _pDir.z);
            player.surface = _env.surface;
            player.env = _env;
            player.speedMul = 1.0; // will be set below

            // Movement speed modifiers based on surface type
            let surfaceSpeedMul = 1.0;
            let surfaceDragMul = 1.0;
            // Terrain effects at 50% intensity (lerp toward 1.0)
            if (_env.surface === 'shallow_water') { surfaceSpeedMul = 0.75; surfaceDragMul = 0.975; }
            else if (_env.surface === 'deep_water') { surfaceSpeedMul = 0.575; surfaceDragMul = 0.99; }
            else if (_env.surface === 'swamp')      { surfaceSpeedMul = 0.7; surfaceDragMul = 0.96; }
            else if (_env.surface === 'ice')        { surfaceSpeedMul = 0.95; surfaceDragMul = 0.99; }
            else if (_env.surface === 'sand')       { surfaceSpeedMul = 0.9; surfaceDragMul = 0.96; }

            player.speedMul = surfaceSpeedMul;

            const running = keys.ShiftLeft || keys.ShiftRight;
            const accel = (running ? RUN_ACCEL : WALK_ACCEL) * surfaceSpeedMul;
            const maxSpd = (running ? MAX_RUN : MAX_WALK) * surfaceSpeedMul;
            const grounded = player.grounded;
            const controlFactor = grounded ? 1.0 : AIR_CONTROL;

            // RITUAL LOCKOUT — during the entrance ritual the player has
            // no control. We still call moveOnSurface(0,0,0) below so the
            // grounding system / camera continue to update.
            if (player.ritualActive) {
                player.vFwd = 0;
                player.vStrafe = 0;
                player.headingDelta = 0;
                player._lastHeading = player.heading;
            } else {
                // Arrow keys turn the character (in addition to mouse).
                const KEY_TURN_RATE = 2.2; // rad/s — full quarter turn in ~0.7s
                if (keys.ArrowLeft)  player.heading += KEY_TURN_RATE * dt;
                if (keys.ArrowRight) player.heading -= KEY_TURN_RATE * dt;

                // Track per-frame heading change so the animator knows we're turning
                // (catches BOTH keyboard and mouse — the mouse listener writes to
                // player.heading asynchronously, so we measure delta here).
                const _hPrev = player._lastHeading ?? player.heading;
                player.headingDelta = Math.abs(player.heading - _hPrev);
                player._lastHeading = player.heading;

                // A/D = strafe left/right
                let strafeInput = 0;
                if (keys.KeyA) strafeInput += 1;
                if (keys.KeyD) strafeInput -= 1;
                if (strafeInput) {
                    const targetS = strafeInput * maxSpd * 0.7; // strafe is 70% of walk speed
                    player.vStrafe = (player.vStrafe || 0) + (targetS - (player.vStrafe || 0)) * accel * controlFactor * dt * 60;
                }
                player.vStrafe = (player.vStrafe || 0) * (grounded ? (GROUND_DRAG * surfaceDragMul) : AIR_DRAG);
                if (Math.abs(player.vStrafe || 0) < 0.0001) player.vStrafe = 0;

                // Forward/back
                let fwdInput = 0;
                if (keys.KeyW || keys.ArrowUp)   fwdInput += 1;
                if (keys.KeyS || keys.ArrowDown) fwdInput -= 1;
                if (fwdInput) {
                    const targetV = fwdInput * maxSpd;
                    player.vFwd += (targetV - player.vFwd) * accel * controlFactor * dt * 60;
                }
                player.vFwd *= grounded ? (GROUND_DRAG * surfaceDragMul) : AIR_DRAG;
                if (Math.abs(player.vFwd) < 0.0001) player.vFwd = 0;
            }

            // Apply movement
            moveOnSurface(player.vFwd, player.vStrafe || 0, 0);

            // Jumping (suppressed during the entrance ritual)
            if (keys.Space && grounded && !player.ritualActive) {
                player.vAir = JUMP_FORCE;
                player.grounded = false;
                character.scale.set(0.92, 1.1, 0.92);
            }

            player.wasGrounded = grounded;

            const cs=updateChar();

            // Landing detection — trigger squash
            if (player.grounded && !player.wasGrounded) {
                player.landTimer = 0.2;
                // Kill some forward speed on hard landing
                if (player.jumpTimer > 0.3) player.vFwd *= 0.7;
            }

            animChar(dt, t);
            updateCam(cs);

            // Animate world
            // Moon orbit
            {
                const moonAngle = performance.now() * 0.001 * MOON_SPEED;
                moonGroup.position.set(
                    Math.cos(moonAngle) * MOON_ORBIT,
                    Math.sin(moonAngle * 0.3) * MOON_ORBIT * 0.05,
                    Math.sin(moonAngle) * MOON_ORBIT
                );
                moonGroup.rotation.y += 0.0008;
            }
            for(const b of windmills) b.rotation.z+=dt*2;
            for(const c of clouds){
                const q=new THREE.Quaternion().setFromAxisAngle(c.axis, dt*c.speed);
                c.mesh.position.applyQuaternion(q);
                c.mesh.lookAt(0,0,0); c.mesh.rotateX(Math.PI);
            }
            // Campfire flicker
            for(const fl of fireLights){
                fl.intensity=1.2+Math.sin(t*8+Math.random()*2)*.5+Math.random()*.2;
            }
            // Animate all registered animated objects (NPCs, animals)
            for (const obj of world.animated) obj.update(t, dt);

            hudT+=dt; if(hudT>0.2){updateHUD();hudT=0;}
            mmT+=dt; if(mmT>0.5){drawMinimap();mmT=0;}

            // Debug measurements (toggle with F3)
            if(_debugVisible) {
                updateDebugPanel(cs, dt);
                // Update MC collision circle position
                _mcCircle.position.copy(player.groundPos.clone().add(cs.up.clone().multiplyScalar(0.1)));
                _mcCircle.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), cs.up);
            }

            updateCameraOcclusion();
            renderer.render(scene,camera);
        }

        addEventListener('resize',()=>{
            camera.aspect=innerWidth/innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth,innerHeight);
        });

        setTimeout(()=>{
            document.getElementById('loading').classList.add('hidden');
            setTimeout(()=>document.getElementById('loading').style.display='none',800);
            // Brief beat after the loading screen begins to fade, then run
            // the entrance ritual. The 600ms gap lets the player register
            // the world before the character animates.
            setTimeout(startEntranceRitual, 600);
        },1500);
        // Help button: collapse/expand the controls hint into the corner
        document.getElementById('help-btn').addEventListener('click', () => {
            document.getElementById('controls-hint').classList.toggle('collapsed');
        });

        updateHUD(); drawMinimap(); animate();

        // ============================================================
        // AUTOMATED TEST SYSTEM
        // Press T to run the ground-truth test tour.
        // The MC walks a full circuit, logging position vs expected
        // ground height at every step. Results printed to console.
        // ============================================================
        let _testRunning = false;
        addEventListener('keydown', e => {
            // Moved off KeyT (which is now the Dance emote). F2 is dev/debug.
            if (e.code === 'F2' && !_testRunning) runGroundTest();
        });

        async function runGroundTest() {
            _testRunning = true;
            console.log('=== GROUND TEST STARTING ===');
            console.log('Walking MC through 360° tour, sampling 200 points...');

            const results = [];
            const startPos = player.groundPos.clone();
            const startHeading = player.heading;

            // Walk a full circle around the planet at the current latitude
            const steps = 200;
            for (let i = 0; i < steps; i++) {
                // Simulate forward movement
                player.vFwd = MAX_WALK * 0.5;
                moveOnSurface(player.vFwd, 0.031); // slight turn = circle

                // Let updateChar snap to ground
                updateChar();

                const n = player.groundPos.clone().normalize();
                const expectedR = groundHeight(n.x, n.y, n.z);
                const actualR = player.groundPos.length();
                const error = actualR - expectedR;

                // Sample what the planet mesh vertex nearest here looks like
                const lat = Math.asin(n.y) * 180 / Math.PI;
                const lon = Math.atan2(n.z, n.x) * 180 / Math.PI;
                const biome = getBiome(n.x, n.y, n.z);

                results.push({
                    step: i,
                    lat: lat.toFixed(1),
                    lon: lon.toFixed(1),
                    biome: biome.name,
                    expectedR: expectedR.toFixed(4),
                    actualR: actualR.toFixed(4),
                    error: error.toFixed(4),
                    charY: character.position.length().toFixed(4),
                    airborne: player.airborne.toFixed(4),
                    grounded: player.grounded
                });

                // Wait one frame so the scene updates
                await new Promise(r => requestAnimationFrame(r));
            }

            // Restore position
            player.groundPos.copy(startPos);
            player.heading = startHeading;
            player.vFwd = 0;
            player.vTurn = 0;
            updateChar();

            // Analyze results
            const errors = results.map(r => Math.abs(parseFloat(r.error)));
            const maxErr = Math.max(...errors);
            const avgErr = errors.reduce((a, b) => a + b, 0) / errors.length;
            const floaters = results.filter(r => parseFloat(r.error) > 0.05);
            const sinkers = results.filter(r => parseFloat(r.error) < -0.05);

            console.log('=== GROUND TEST RESULTS ===');
            console.log(`Samples: ${steps}`);
            console.log(`Max error: ${maxErr.toFixed(4)} (pos vs groundHeight)`);
            console.log(`Avg error: ${avgErr.toFixed(4)}`);
            console.log(`Floating (>0.05): ${floaters.length} points`);
            console.log(`Sinking (<-0.05): ${sinkers.length} points`);

            if (floaters.length > 0) {
                console.log('--- WORST FLOATING POINTS ---');
                floaters.sort((a, b) => parseFloat(b.error) - parseFloat(a.error));
                floaters.slice(0, 5).forEach(r =>
                    console.log(`  Step ${r.step}: ${r.biome} @ ${r.lat}°,${r.lon}° | expected=${r.expectedR} actual=${r.actualR} err=${r.error} airborne=${r.airborne} grounded=${r.grounded}`)
                );
            }
            if (sinkers.length > 0) {
                console.log('--- WORST SINKING POINTS ---');
                sinkers.sort((a, b) => parseFloat(a.error) - parseFloat(b.error));
                sinkers.slice(0, 5).forEach(r =>
                    console.log(`  Step ${r.step}: ${r.biome} @ ${r.lat}°,${r.lon}° | expected=${r.expectedR} actual=${r.actualR} err=${r.error} airborne=${r.airborne} grounded=${r.grounded}`)
                );
            }

            // Also check: is character.position at the same radius as groundPos?
            const charVsGround = results.map(r => Math.abs(parseFloat(r.charY) - parseFloat(r.actualR)));
            const maxCharErr = Math.max(...charVsGround);
            console.log(`Character position vs groundPos max deviation: ${maxCharErr.toFixed(4)}`);

            if (maxErr < 0.01) {
                console.log('✓ PASS — character precisely tracks groundHeight()');
            } else if (maxErr < 0.1) {
                console.log('~ MARGINAL — small deviations detected');
            } else {
                console.log('✗ FAIL — significant ground tracking errors');
            }

            console.log('Full data:', JSON.stringify(results.filter((_, i) => i % 10 === 0), null, 2));
            console.log('=== TEST COMPLETE ===');
            _testRunning = false;
        }

        // Mark solid objects and make them double-sided for raycasting
        for (const obj of world.all) {
            if (!obj.mesh) continue;
            const rules = getRules(obj.type);
            if (!rules.solid && !rules.walkable) { obj.collision = null; continue; }
            obj.collision = true;
            obj.mesh.traverse(child => {
                if (child.isMesh && child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => { m.side = THREE.DoubleSide; });
                    else child.material.side = THREE.DoubleSide;
                }
            });
        }
        console.log('Collision bounds set for', world.all.length, 'objects');

        // Debug visualization (F3 mode)
        // Debug shapes placeholder (collision is mesh-based, no visualization needed)
        const _debugShapes = [];
        function buildDebugShapes() {}

        // MC collision circle
        const _mcCircle = new THREE.Mesh(
            new THREE.RingGeometry(MC_RADIUS - 0.03, MC_RADIUS + 0.03, 16),
            new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.4, depthWrite: false, side: THREE.DoubleSide })
        );
        _mcCircle.visible = false;
        scene.add(_mcCircle);

        // Expose for external testing
        window._game = { player, character, camera, scene, renderer, world, updateChar, updateCam,
            moveOnSurface, getFrame, groundHeight, getBiome, MAX_WALK, WALK_ACCEL, GROUND_DRAG,
            WORLD_SCALE, PR, CH, keys, playOneShot, playRandomEmote, startEntranceRitual,
            camMode: () => camMode, setCamMode: (m) => { camMode = m; } };

    </script>
    </body>
