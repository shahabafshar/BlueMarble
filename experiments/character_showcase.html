<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;color:#e0e0e8;font-family:'Segoe UI',sans-serif;overflow:hidden}
#canvas-host{position:fixed;inset:0}
#panel{position:fixed;top:0;left:0;bottom:0;z-index:10;background:rgba(20,20,40,0.94);
width:280px;overflow-y:auto;padding:12px 14px;backdrop-filter:blur(8px)}
#panel h2{font-size:1em;color:#6cf;margin-bottom:6px;position:sticky;top:0;
background:rgba(20,20,40,0.98);padding:6px 0;z-index:1}
.cat-label{font-size:0.72em;color:#fc6;margin:10px 0 4px;text-transform:uppercase;letter-spacing:1px}
.item-btn{display:block;width:100%;text-align:left;background:rgba(108,207,255,0.08);
color:#e0e0e8;border:1px solid rgba(108,207,255,0.18);padding:6px 8px;margin-bottom:3px;
border-radius:5px;cursor:pointer;font-size:0.75em}
.item-btn:hover{background:rgba(108,207,255,0.2)}
.item-btn.active{background:#6cf;color:#1a1a2e;font-weight:700}
#anim-panel{position:fixed;top:12px;right:12px;z-index:10;background:rgba(20,20,40,0.92);
padding:12px 14px;border-radius:10px;backdrop-filter:blur(8px);min-width:200px;max-width:260px;
max-height:70vh;overflow-y:auto}
#anim-panel h3{font-size:0.85em;color:#6cf;margin-bottom:6px}
.anim-btn{display:block;width:100%;text-align:left;background:rgba(255,255,255,0.06);
color:#e0e0e8;border:1px solid rgba(255,255,255,0.12);padding:4px 8px;margin-bottom:2px;
border-radius:4px;cursor:pointer;font-size:0.7em;font-family:Consolas,monospace}
.anim-btn:hover{background:rgba(108,207,255,0.18)}
.anim-btn.active{background:#6cf;color:#1a1a2e;font-weight:600}
#info{position:fixed;bottom:12px;right:12px;z-index:10;background:rgba(20,20,40,0.85);
padding:8px 12px;border-radius:8px;font-size:0.72em;line-height:1.5;color:#aaa;max-width:280px}
#info strong{color:#6cf}
#loading{position:fixed;inset:0;background:rgba(20,20,40,0.96);display:flex;
align-items:center;justify-content:center;z-index:100;font-size:1.1em;color:#6cf;
transition:opacity 0.3s}
#loading.hidden{opacity:0;pointer-events:none}

// ============================================================
// SCENE
// ============================================================
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1a2e);
scene.fog = new THREE.Fog(0x1a1a2e, 15, 45);
const camera = new THREE.PerspectiveCamera(40, (innerWidth-280)/innerHeight, 0.01, 1000);
camera.position.set(3, 2.5, 5);
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth - 280, innerHeight);
renderer.setPixelRatio(devicePixelRatio);
renderer.shadowMap.enabled = true;
const host = document.getElementById('canvas-host');
host.style.left = '280px';
host.appendChild(renderer.domElement);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.target.set(0, 1, 0);

scene.add(new THREE.AmbientLight(0xffffff, 0.5));
const sun = new THREE.DirectionalLight(0xffffff, 0.85);
sun.position.set(5, 8, 5); sun.castShadow = true; scene.add(sun);
scene.add(new THREE.DirectionalLight(0x88aaff, 0.25));
const ground = new THREE.Mesh(
    new THREE.CircleGeometry(12, 32),
    new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 1 })
);
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
scene.add(new THREE.GridHelper(12, 24, 0x444466, 0x2a2a3a));

// ============================================================
// LOADER
// ============================================================
let currentModel = null, mixer = null, actions = {}, activeAction = null;
const clock = new THREE.Clock();
const gltfLoader = new THREE.GLTFLoader();
const loadingEl = document.getElementById('loading');

function clearModel() {
    if (currentModel) {
        scene.remove(currentModel);
        currentModel.traverse(n => {
            if (n.geometry) n.geometry.dispose();
            if (n.material) (Array.isArray(n.material)?n.material:[n.material]).forEach(m=>m.dispose());
        });
        currentModel = null;
    }
    mixer = null; actions = {}; activeAction = null;
}

function fitCamera(model) {
    const box = new THREE.Box3().setFromObject(model);
    const size = new THREE.Vector3(); box.getSize(size);
    const center = new THREE.Vector3(); box.getCenter(center);
    const d = Math.max(size.x, size.y, size.z) * 2.5;
    camera.position.set(d*0.7, d*0.5, d);
    controls.target.copy(center); controls.update();
}

function showModel(model, animations, label) {
    clearModel();
    currentModel = model;
    scene.add(model);
    model.traverse(n => { if(n.isMesh){n.castShadow=true;n.receiveShadow=true;} });
    fitCamera(model);

    // Info panel
    const box = new THREE.Box3().setFromObject(model);
    const sz = new THREE.Vector3(); box.getSize(sz);
    let meshCount = 0, verts = 0;
    model.traverse(n => { if(n.isMesh){ meshCount++; if(n.geometry&&n.geometry.attributes.position) verts+=n.geometry.attributes.position.count; }});
    document.getElementById('info').innerHTML =
        '<strong>' + label + '</strong><br>' +
        'Size: ' + sz.x.toFixed(1)+'m x '+sz.y.toFixed(1)+'m x '+sz.z.toFixed(1)+'m<br>' +
        'Meshes: '+meshCount+' &middot; Verts: '+verts+'<br>' +
        'Animations: '+(animations?animations.length:0);

    // Animation buttons
    const list = document.getElementById('anim-list');
    list.innerHTML = '';
    if (animations && animations.length) {
        mixer = new THREE.AnimationMixer(model);
        animations.forEach(clip => {
            actions[clip.name] = mixer.clipAction(clip);
            const btn = document.createElement('button');
            btn.className = 'anim-btn';
            btn.textContent = clip.name.replace(/^(Rig\||CharacterArmature\|)/, '');
            btn.dataset.name = clip.name;
            btn.onclick = () => playAnim(clip.name);
            list.appendChild(btn);
        });
        const idle = animations.find(c => /idle/i.test(c.name) && !/gun|torch|spell|sit/i.test(c.name));
        playAnim(idle ? idle.name : animations[0].name);
    } else {
        list.innerHTML = '<em style="color:#555">No animations (static prop)</em>';
    }
}

function playAnim(name) {
    if (!mixer || !actions[name]) return;
    const next = actions[name];
    if (activeAction && activeAction !== next) activeAction.fadeOut(0.2);
    next.reset().fadeIn(0.2).play();
    activeAction = next;
    document.querySelectorAll('.anim-btn').forEach(b => b.classList.toggle('active', b.dataset.name===name));
}

function loadItem(entry) {
    loadingEl.classList.remove('hidden');
    loadingEl.textContent = 'Loading ' + entry.name + '...';
    document.querySelectorAll('.item-btn').forEach(b => b.classList.toggle('active', b.dataset.url===entry.url));
    gltfLoader.load(entry.url, (gltf) => {
        showModel(gltf.scene, gltf.animations, entry.name);
        loadingEl.classList.add('hidden');
    }, undefined, (err) => {
        loadingEl.textContent = 'Error loading ' + entry.name;
        console.error(err);
        setTimeout(() => loadingEl.classList.add('hidden'), 2000);
    });
}

// ============================================================
// BUILD CATALOG UI
// ============================================================
const catalogEl = document.getElementById('catalog');
let firstEntry = null;
for (const [category, items] of Object.entries(CATALOG)) {
    const label = document.createElement('div');
    label.className = 'cat-label';
    label.textContent = category;
    catalogEl.appendChild(label);
    for (const entry of items) {
        if (!firstEntry) firstEntry = entry;
        const btn = document.createElement('button');
        btn.className = 'item-btn';
        btn.dataset.url = entry.url;
        btn.textContent = entry.name;
        btn.onclick = () => loadItem(entry);
        catalogEl.appendChild(btn);
    }
}
if (firstEntry) loadItem(firstEntry);

// ============================================================
// RENDER
// ============================================================
function animate() {
    requestAnimationFrame(animate);
    if (mixer) mixer.update(clock.getDelta());
    controls.update();
    renderer.render(scene, camera);
}
animate();
addEventListener('resize', () => {
    camera.aspect = (innerWidth-280)/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth-280, innerHeight);
});
</script>
</body>
</html>
